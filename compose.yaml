services:
  # MySQL 独立容器
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keystone
      MYSQL_USER: keystone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # 数据保存在 Docker Volume，删除容器不会丢失
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 -uroot --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # Redis 独立容器
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      # 保存 Redis 持久化数据
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # Go 后端独立容器
  backend:
    image: keystonego-backend:local
    build:
      context: ./backend
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    restart: unless-stopped
    volumes:
      # 运行时挂载敏感配置，不写入镜像
      - ./deploy/backend/bootstrap.yaml:/app/config/bootstrap.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/readyz"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # 前端和 Nginx 独立容器
  frontend:
    image: keystonego-frontend:local
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      # 虚拟机 80 端口映射到 Nginx 80 端口
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

# 保存数据库和 Redis 数据
volumes:
  mysql_data:
  redis_data:

# 四个容器通过内部网络通信
networks:
  app_network: